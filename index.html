<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecrutLocal - Postuler</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .card { background: white; max-width: 420px; margin: 20px auto; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #111; font-size: 22px; text-align: center; }
    p.sub { color: #666; font-size: 14px; text-align: center; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
    input, select { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 14px; background: #0070f3; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card" id="form-card">
    <h2>Postuler en 1 minute 🚀</h2>
    <p class="sub">Complétez ce mini-formulaire pour le recruteur.</p>
    
    <form id="candidate-form">
      <label>Prénom</label>
      <input required id="firstName" type="text" placeholder="Ex: Jean">

      <label>Nom</label>
      <input required id="lastName" type="text" placeholder="Ex: Dupont">

      <label>Téléphone Mobile</label>
      <input required id="phone" type="tel" placeholder="06 12 34 56 78">

      <label>Disponible le week-end et en soirée ?</label>
      <select id="weekendOk">
        <option value="true">Oui, tout à fait</option>
        <option value="false">Non</option>
      </select>

      <label>Expérience dans le domaine</label>
      <select id="experience">
        <option value="0">Aucune expérience</option>
        <option value="<1">Moins d'un an</option>
        <option value="1-3">1 à 3 ans</option>
        <option value=">3">Plus de 3 ans</option>
      </select>

      <button type="submit" id="btn-submit">Envoyer ma candidature</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://bouuhrddzrolkzxvnydw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gee-Ly8I2QyduMq_rPXcyA_hg3jnhHi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Récupérer le paramètre shop dans l'URL du QR Code (ex: ?shop=usr_12345)
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop') || 'default_shop';

    document.getElementById('candidate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.innerText = 'Envoi en cours...';
      btn.disabled = true;

      const payload = {
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        phone: document.getElementById('phone').value,
        email: 'candidat@mobile.com',
        weekend_ok: document.getElementById('weekendOk').value === 'true',
        experience_years: document.getElementById('experience').value,
        company_id: shopId
      };

      const { data, error } = await supabaseClient.from('candidates').insert([payload]);

      if (error) {
        alert('Erreur : ' + error.message);
        btn.innerText = 'Envoyer ma candidature';
        btn.disabled = false;
      } else {
        document.getElementById('form-card').innerHTML = `
          <h2 style="text-align:center;">🎉 Candidature envoyée !</h2>
          <p style="text-align:center; color:#666;">Le gérant du commerce a bien reçu votre profil.</p>
        `;
      }
    });
  </script>
</body>
</html>
