<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecrutLocal - Candidature</title>
  
  <!-- Chargement des bibliothèques React et Supabase -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .card { background: white; max-width: 420px; margin: 40px auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #111; font-size: 24px; text-align: center; }
    p.sub { color: #666; font-size: 14px; text-align: center; margin-bottom: 24px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
    input, select { width: 100%; padding: 12px; margin-bottom: 18px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 14px; background: #0070f3; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background: #888; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- DEBUT DU CODE JAVASCRIPT -->
  <script type="text/babel">
    // Remplace par ton URL et ta clé Supabase
    const SUPABASE_URL = 'https://TON-PROJET.supabase.co';
    const SUPABASE_KEY = 'TA_CLE_ANON_PUBLIC';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [firstName, setFirstName] = React.useState('');
      const [lastName, setLastName] = React.useState('');
      const [phone, setPhone] = React.useState('');
      const [weekendOk, setWeekendOk] = React.useState(true);
      const [experience, setExperience] = React.useState('1-3');
      const [submitted, setSubmitted] = React.useState(false);
      const [loading, setLoading] = React.useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);

        // Envoi des données vers Supabase
        const { error } = await supabaseClient.from('candidates').insert([{
          first_name: firstName,
          last_name: lastName,
          phone: phone,
          email: 'non_renseigne@mail.com',
          weekend_ok: weekendOk,
          experience_years: experience
        }]);

        setLoading(false);
        if (!error) {
          setSubmitted(true);
        } else {
          alert("Erreur lors de l'envoi : " + error.message);
        }
      };

      if (submitted) {
        return (
          <div className="card" style={{textAlign: 'center'}}>
            <h2>🎉 Candidature envoyée !</h2>
            <p>Le gérant a bien reçu vos informations.</p>
          </div>
        );
      }

      return (
        <div className="card">
          <h2>Postuler en 1 minute 🚀</h2>
          <p className="sub">Complétez ce mini-formulaire.</p>
          <form onSubmit={handleSubmit}>
            <label>Prénom</label>
            <input required type="text" placeholder="Ex: Jean" value={firstName} onChange={e => setFirstName(e.target.value)} />

            <label>Nom</label>
            <input required type="text" placeholder="Ex: Dupont" value={lastName} onChange={e => setLastName(e.target.value)} />

            <label>Téléphone Mobile</label>
            <input required type="tel" placeholder="06 12 34 56 78" value={phone} onChange={e => setPhone(e.target.value)} />

            <label>Disponible le week-end et en soirée ?</label>
            <select value={weekendOk} onChange={e => setWeekendOk(e.target.value === 'true')}>
              <option value="true">Oui, tout à fait</option>
              <option value="false">Non</option>
            </select>

            <label>Expérience dans le domaine</label>
            <select value={experience} onChange={e => setExperience(e.target.value)}>
              <option value="0">Aucune expérience</option>
              <option value="<1">Moins d'un an</option>
              <option value="1-3">1 à 3 ans</option>
              <option value=">3">Plus de 3 ans</option>
            </select>

            <button type="submit" disabled={loading}>
              {loading ? 'Envoi...' : 'Envoyer ma candidature'}
            </button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <!-- FIN DU CODE JAVASCRIPT -->
</body>
</html>
