<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecrutLocal - Espace Commerçant</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: white; padding: 24px; border-radius: 16px; margin-bottom: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #111; font-size: 22px; text-align: center; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #333; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 14px; background: #0070f3; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .qr-box { text-align: center; background: #fafafa; padding: 16px; border-radius: 12px; border: 1px dashed #ccc; margin-bottom: 20px; }
    .qr-box img { width: 180px; height: 180px; margin: 10px 0; }
    .badge { display: inline-block; background: #e6f0ff; color: #0066cc; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .candidate-card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #eee; }
    .btn-contact { display: inline-block; padding: 10px 14px; background: #25D366; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- ÉCRAN 1 : CONNEXION / INSCRIPTION COMMERÇANT -->
    <div id="auth-section" class="card">
      <h2>Espace Gérant 🏪</h2>
      <p style="text-align:center; color:#666; font-size:14px; margin-bottom:20px;">Entrez le nom de votre commerce pour accéder à votre tableau de bord.</p>
      
      <label>Nom de votre commerce</label>
      <input id="shopNameInput" type="text" placeholder="Ex: Boulangerie du Centre">

      <button onclick="loginShop()">Accéder à mon espace</button>
    </div>

    <!-- ÉCRAN 2 : DASHBOARD PRIVÉ DU COMMERCE -->
    <div id="dashboard-section" style="display: none;">
      <div class="card">
        <div style="display:flex; justify-between; align-items:center; margin-bottom:10px;">
          <h2 id="shop-title" style="margin:0; text-align:left;">...</h2>
          <button onclick="logoutShop()" style="width:auto; padding:6px 12px; background:#eee; color:#333; font-size:12px;">Déconnexion</button>
        </div>

        <div class="qr-box">
          <div style="font-weight: 600; font-size: 15px;">Votre QR Code Candidat 📱</div>
          <p style="font-size: 12px; color: #666; margin: 4px 0 10px 0;">Imprimez ce QR code sur votre vitrine :</p>
          <img id="qr-image" src="" alt="QR Code">
          <div>
            <a id="candidate-link" href="#" target="_blank" style="font-size: 12px; color: #0070f3;">Ouvrir la page candidat</a>
          </div>
        </div>

        <h3>Candidatures reçues 📥</h3>
        <div id="list">Chargement des candidatures...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://bouuhrddzrolkzxvnydw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gee-Ly8I2QyduMq_rPXcyA_hg3jnhHi';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Vérifier si un commerce est déjà connecté dans le navigateur
    let currentShop = localStorage.getItem('recrutlocal_shop');

    if (currentShop) {
      showDashboard();
    }

    function loginShop() {
      const input = document.getElementById('shopNameInput').value.trim();
      if (!input) {
        alert('Veuillez entrer le nom de votre commerce.');
        return;
      }
      // Nettoyage de l'ID pour créer une clé propre (ex: "Boulangerie du Centre" -> "boulangerie-du-centre")
      currentShop = input.toLowerCase().replace(/[^a-z0-9]/g, '-');
      localStorage.setItem('recrutlocal_shop', currentShop);
      localStorage.setItem('recrutlocal_shop_name', input);
      showDashboard();
    }

    function logoutShop() {
      localStorage.removeItem('recrutlocal_shop');
      localStorage.removeItem('recrutlocal_shop_name');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';

      const shopName = localStorage.getItem('recrutlocal_shop_name') || currentShop;
      document.getElementById('shop-title').innerText = shopName;

      // Générer le lien candidat et le QR code unique
      const candidateUrl = `https://recrutlocal.vercel.app/?shop=${encodeURIComponent(currentShop)}`;
      document.getElementById('candidate-link').href = candidateUrl;
      document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(candidateUrl)}`;

      loadCandidates();
    }

    async function loadCandidates() {
      const { data, error } = await supabaseClient
        .from('candidates')
        .select('*')
        .eq('company_id', currentShop)
        .order('created_at', { ascending: false });

      const container = document.getElementById('list');

      if (error) {
        container.innerHTML = '<p>Erreur de chargement.</p>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:#777; font-size:14px;">Aucune candidature reçue pour le moment.</p>';
        return;
      }

      container.innerHTML = '';
      data.forEach(c => {
        const cleanPhone = c.phone ? c.phone.replace(/\s+/g, '') : '';
        container.innerHTML += `
          <div class="candidate-card">
            <span class="badge">Expérience : ${c.experience_years || 'Non renseignée'}</span>
            <div style="font-weight:bold; font-size:16px;">${c.first_name || ''} ${c.last_name || ''}</div>
            <div style="font-size:13px; color:#555; margin-top:4px;">
              📱 ${c.phone || 'Non renseigné'} <br>
              🗓️ Dispo WE : <strong>${c.weekend_ok ? 'Oui' : 'Non'}</strong>
            </div>
            <a class="btn-contact" href="https://wa.me/${cleanPhone}?text=Bonjour%20${encodeURIComponent(c.first_name || '')},%20suite%20%C3%A0%20votre%20candidature,%20souhaitez-vous%20passer%20un%20entretien%20?" target="_blank">
              Contacter sur WhatsApp
            </a>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
